spring:
  datasource:
    url: jdbc:postgresql://${ENV_DB_HOST:localhost}:${ENV_DB_PORT:5432}/${ENV_DB_NAME:db}?currentSchema=${ENV_DB_SCHEMA:schema}&useUnicode=true&sslmode=disable&serverTimezone=UTC
    username: ${ENV_DB_USERNAME:postgres}
    password: ${ENV_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${ENV_DB_POOL_SIZE:2}

app:
  ui-setting:
    allow-cors: ${UI_CORS_URLS:http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:5173,http://localhost:5174,http://localhost:5175}

cloudinary:
  name: ${CLOUDINARY_CLOUD_NAME:cloudinary}
  key: ${CLOUDINARY_API_KEY:cloudinary}
  secret: ${CLOUDINARY_API_SECRET:cloudinary}